[package]
name = "photo-exit-manifest"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A local, read-only assurance manifest for family photo cloud migrations"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-photo-exit-manifest"
keywords = ["photos", "migration", "google-takeout", "archive", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

